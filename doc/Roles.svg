  <g font-size="13" fill="#312e81">
    <rect x="436" y="434" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="448" y="451">Product Owner</text>
    <rect x="436" y="464" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="448" y="481">Product Manager</text>
    <rect x="436" y="494" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="448" y="511">UX Designer</text>
  </g>

  <!-- Management & Conseil -->
  <rect x="420" y="550" width="376" height="194" rx="10" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="436" y="574" font-size="14" font-weight="700" fill="#4338ca">MANAGEMENT &amp; CONSEIL</text>
  <g font-size="13" fill="#312e81">
    <rect x="436" y="584" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="448" y="601">Engineering Manager</text>
    <rect x="436" y="614" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="448" y="631">Delivery Manager</text>
    <rect x="436" y="644" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="448" y="661">Coach (team, organisation)</text>
    <rect x="436" y="674" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="448" y="691">Scrum Master</text>
    <rect x="436" y="704" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="448" y="721">Consultant / Conseil</text>
