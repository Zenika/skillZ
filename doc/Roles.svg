    <rect x="436" y="140" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="448" y="157">Data Scientist</text>
    <rect x="436" y="170" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="448" y="187">Analytics Engineer</text>
    <rect x="436" y="200" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="448" y="217">Forward Deployed AI Engineer</text>
    <rect x="436" y="230" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="448" y="247">Data Architect</text>
    <rect x="436" y="260" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="448" y="277">ML Engineer</text>
    <rect x="436" y="290" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="448" y="307">AI Engineer</text>
    <rect x="436" y="320" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="448" y="337">AI / ML Architect</text>
    <rect x="436" y="350" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="448" y="367">Responsible AI Lead</text>
  </g>

  <!-- Produit & Design -->
