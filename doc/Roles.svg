<svg xmlns="http://www.w3.org/2000/svg" width="820" height="760" viewBox="0 0 820 760" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
  <rect width="820" height="760" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#1a1a2e">Rôles (29)</text>
  <text x="24" y="54" font-size="13" fill="#6b7280">Rôle d'un·e collaborateur·rice (relation User ↔ Role). Regroupés ici par famille.</text>

  <!-- ============ COLONNE GAUCHE ============ -->
