<svg xmlns="http://www.w3.org/2000/svg" width="820" height="640" viewBox="0 0 820 640" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
  <rect width="820" height="640" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#1a1a2e">Rôles (25)</text>
  <text x="24" y="54" font-size="13" fill="#6b7280">Rôle d'un·e collaborateur·rice (relation User ↔ Role). Regroupés ici par famille.</text>

  <!-- ============ COLONNE GAUCHE ============ -->
  <!-- Développement & Architecture -->
  <rect x="24" y="76" width="376" height="224" rx="10" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="40" y="100" font-size="14" font-weight="700" fill="#4338ca">DÉVELOPPEMENT &amp; ARCHITECTURE</text>
  <g font-size="13" fill="#312e81">
    <rect x="40" y="110" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="52" y="127">Developer / Engineer</text>
    <rect x="40" y="140" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="52" y="157">Technical Lead</text>
    <rect x="40" y="170" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="52" y="187">Technical Expert / Specialist</text>
    <rect x="40" y="200" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="52" y="217">Solution Architect</text>
    <rect x="40" y="230" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="52" y="247">Full Stack Developer</text>
    <rect x="40" y="260" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="52" y="277">Staff / Principal Engineer</text>
  </g>

  <!-- Cloud, Infra & Ops -->
  <rect x="24" y="316" width="376" height="194" rx="10" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="40" y="340" font-size="14" font-weight="700" fill="#4338ca">CLOUD, INFRA &amp; OPS</text>
  <g font-size="13" fill="#312e81">
    <rect x="40" y="350" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="52" y="367">SRE (Site Reliability Engineer)</text>
    <rect x="40" y="380" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="52" y="397">Infra / Ops Engineer</text>
    <rect x="40" y="410" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="52" y="427">DevOps CI-CD Engineer</text>
    <rect x="40" y="440" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="52" y="457">Security Engineer</text>
    <rect x="40" y="470" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="52" y="487">Cloud Architect</text>
  </g>

  <!-- Formation -->
  <rect x="24" y="526" width="376" height="74" rx="10" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="40" y="550" font-size="14" font-weight="700" fill="#4338ca">FORMATION</text>
  <g font-size="13" fill="#312e81">
    <rect x="40" y="560" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="52" y="577">Trainer / Formateur</text>
  </g>

  <!-- ============ COLONNE DROITE ============ -->
  <!-- Data & IA -->
  <rect x="420" y="76" width="376" height="194" rx="10" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="436" y="100" font-size="14" font-weight="700" fill="#4338ca">DATA &amp; IA</text>
  <g font-size="13" fill="#312e81">
    <rect x="436" y="110" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="448" y="127">Data Engineer / Scientist</text>
    <rect x="436" y="140" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="448" y="157">ML Engineer</text>
    <rect x="436" y="170" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="448" y="187">AI Engineer</text>
    <rect x="436" y="200" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="448" y="217">AI / ML Architect</text>
    <rect x="436" y="230" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="448" y="247">Responsible AI Lead</text>
  </g>

  <!-- Produit & Design -->
  <rect x="420" y="286" width="376" height="134" rx="10" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="436" y="310" font-size="14" font-weight="700" fill="#4338ca">PRODUIT &amp; DESIGN</text>
  <g font-size="13" fill="#312e81">
    <rect x="436" y="320" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="448" y="337">Product Owner</text>
    <rect x="436" y="350" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="448" y="367">Product Manager</text>
    <rect x="436" y="380" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="448" y="397">UX Designer</text>
  </g>

  <!-- Management & Conseil -->
  <rect x="420" y="436" width="376" height="194" rx="10" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="436" y="460" font-size="14" font-weight="700" fill="#4338ca">MANAGEMENT &amp; CONSEIL</text>
  <g font-size="13" fill="#312e81">
    <rect x="436" y="470" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="448" y="487">Engineering Manager</text>
    <rect x="436" y="500" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="448" y="517">Delivery Manager</text>
    <rect x="436" y="530" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="448" y="547">Coach (team, organisation)</text>
    <rect x="436" y="560" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="448" y="577">Scrum Master</text>
    <rect x="436" y="590" width="344" height="24" rx="12" fill="#e0e7ff"/><text x="448" y="607">Consultant / Conseil</text>
  </g>
</svg>
