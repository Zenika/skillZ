<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
  <rect width="860" height="430" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1a1a2e">Category (quadrant) &amp; Topic.type</text>
  <text x="24" y="54" font-size="13" fill="#6b7280">Une skill appartient à 1 catégorie (N:1) et à plusieurs topics (via SkillTopic), chaque topic étant typé.</text>

  <!-- ==== Category quadrant ==== -->
  <text x="60" y="86" font-size="14" font-weight="700" fill="#374151">Category — 4 quadrants (position x · y, couleur, index)</text>
  <!-- axis labels -->
  <text x="215" y="104" font-size="11" fill="#9ca3af" text-anchor="middle">x = left</text>
  <text x="335" y="104" font-size="11" fill="#9ca3af" text-anchor="middle">x = right</text>
  <text x="52" y="180" font-size="11" fill="#9ca3af" text-anchor="middle" transform="rotate(-90 52 180)">y = top</text>
  <text x="52" y="315" font-size="11" fill="#9ca3af" text-anchor="middle" transform="rotate(-90 52 315)">y = bot</text>

  <!-- cells -->
  <rect x="70" y="112" width="150" height="130" fill="#e8f5e9" stroke="#15803d"/>
  <text x="145" y="168" font-size="15" font-weight="700" fill="#15803d" text-anchor="middle">practices</text>
  <text x="145" y="190" font-size="11" fill="#166534" text-anchor="middle">index 1 · green</text>

  <rect x="220" y="112" width="150" height="130" fill="#ffebee" stroke="#b91c1c"/>
  <text x="295" y="168" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="middle">activities</text>
  <text x="295" y="190" font-size="11" fill="#991b1b" text-anchor="middle">index 2 · red</text>

  <rect x="70" y="242" width="150" height="130" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="145" y="298" font-size="15" font-weight="700" fill="#1565c0" text-anchor="middle">knowledge</text>
  <text x="145" y="320" font-size="11" fill="#1e40af" text-anchor="middle">index 3 · blue</text>

  <rect x="220" y="242" width="150" height="130" fill="#fff8e1" stroke="#a16207"/>
  <text x="295" y="298" font-size="15" font-weight="700" fill="#a16207" text-anchor="middle">behaviors</text>
  <text x="295" y="320" font-size="11" fill="#854d0e" text-anchor="middle">index 4 · yellow</text>

  <!-- ==== Topic types ==== -->
  <text x="470" y="86" font-size="14" font-weight="700" fill="#374151">Topic — 3 types</text>

  <rect x="470" y="104" width="360" height="70" rx="10" fill="#f0fdf9" stroke="#5eead4"/>
  <text x="486" y="130" font-size="15" font-weight="700" fill="#0f766e">domain · 12</text>
  <text x="486" y="154" font-size="12" fill="#134e4a">Métier / domaine technique (Backend, Data, SRE, Observability…)</text>

  <rect x="470" y="184" width="360" height="70" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="486" y="210" font-size="15" font-weight="700" fill="#6d28d9">sensitivity · 14</text>
  <text x="486" y="234" font-size="12" fill="#4c1d95">Sensibilités / pratiques transverses (Agile, Cloud, Security, IA…)</text>

  <rect x="470" y="264" width="360" height="70" rx="10" fill="#fefce8" stroke="#fde047"/>
  <text x="486" y="290" font-size="15" font-weight="700" fill="#a16207">generic · 4</text>
  <text x="486" y="314" font-size="12" fill="#713f12">Transverse à tout (Business, langues, Programming language…)</text>

  <text x="470" y="360" font-size="12" fill="#6b7280">30 topics au total · voir Topics.svg pour le détail.</text>
</svg>
